name: UnityAgent
description: AI agent for Unity C# development with spec-driven workflow (IDE / LLM agnostic)

version: 2.0.0

# Pack root — fixed folder name (repo name Base_Unity_V57), not a version number.
pack_root: V57

# ---------------------------------------------------------------------------
# Game repo layout (provider repo, branch v57/setup). Single source for paths.
# All paths are relative to the game repo root. Legacy roots (root `CONTEXT.md`,
# `Assets/Scripts/`, `Assets/Prefabs/`, `Assets/Scenes/`) are never used.
# ---------------------------------------------------------------------------
layout:
  engine_pin: "6000.6.2f1"            # V57 template ProjectSettings/ProjectVersion.txt; TDD engine is informational
  game_root: Assets/_Game
  provider_owned:                      # read-only for V57: never renamed/moved/edited; fixable issues absorbed by import rules + manifest mapping
    - Docs/Design
    - Docs/ArtDirection
    - Docs/Audio
    - Assets/_Game/Art                 # V57 may add only Materials/ subfolders and UI/Atlases/
    - Assets/_Game/Audio
  v57_owned:
    - Assets/_Game/Art/**/Materials    # MAT_<Asset>.mat
    - Assets/_Game/Art/UI/Atlases      # SpriteAtlas assets from BuildUiAtlases()
    - Assets/_Game/Prefabs/Visual      # PRF_<Asset>_Visual.prefab
    - Assets/_Game/Prefabs/Gameplay    # PRF_<Asset>.prefab (variant of Visual)
    - Assets/_Game/Scenes              # SCN_<...>.unity
    - Assets/_Game/Scripts             # <Area>/ one asmdef per area
    - Assets/_Game/Data                # SO_<...>.asset
    - Assets/_Game/Settings            # Rendering, Input, Presets
    - Assets/_Game/Tests               # EditMode, PlayMode
    - Docs/Generated                   # intake output only — never hand-edited
    - Docs/V57
    - V57/specs/<slug>
    - Packages/manifest.json
    - ProjectSettings
  paths:
    context: Docs/V57/CONTEXT.md       # per game; never swap a root CONTEXT.md
    specs: V57/specs/<slug>/           # features/ and systems/ below
    state: [Docs/V57/STATUS.json, Docs/V57/PLAN.md, Docs/V57/TODO.md, Docs/V57/DECISIONS.md, Docs/V57/DEVLOG.md]
    intake_report: Docs/V57/INTAKE_REPORT.md
    reports: Docs/V57/reports/<stage>-<slug>.md
    assembly_report: Docs/V57/reports/assembly-report.json
    evidence: Docs/V57/evidence/<stage>/<UTC>/
    goldpath_evidence: Docs/V57/evidence/goldpath/<UTC>/checks.json
    state_templates: V57/templates/game-state/
    knowledge: V57/knowledge/
    stop_token: .v57/ALLOW_STOP
  unity_assembly_package:
    id: com.v57.assembly
    manifest_entry: "file:../V57/tools/unity-assembly"
    run_all: 'unity command eval "V57.Assembly.AssemblyRunner.RunAll()"'
    run_all_batch: "-executeMethod V57.Assembly.AssemblyRunner.RunAllBatch"
  tools:
    intake: "node V57/tools/intake/index.js --repo ."
    runtime_lint: "node V57/tools/lint/runtime-lint.js --root Assets/_Game/Scripts --root Assets/_Game/Tests"
    hierarchy_diff: 'unity command eval "V57.Assembly.AssemblyRunner.CaptureHierarchyDiff()"'   # → Docs/V57/reports/hierarchy-diff.json

writes:
  # Autonomous mode (default): write directly; never block on a confirm prompt.
  require_user_confirm_before_spec_yaml: false
  require_user_confirm_before_context_md: false

# ---------------------------------------------------------------------------
# Pipeline (VerticalSlice + Production). Driver: commands/setup/unity-vertical-slice-skill.md
# ---------------------------------------------------------------------------
pipeline:
  stages: [I0, I1, I2, M1, F, M2, M3, M4]
  driver: V57/agents/skills/commands/setup/unity-vertical-slice-skill.md
  production: V57/agents/skills/commands/setup/unity-game-setup-skill.md
  timeboxes_minutes:
    I0: 15
    I1: 30
    I2: 45
    M1: 240
    F_per_spec: 90
    M2: 240
    M3: 240
    M4: 120
  status_words: [implemented, agent-verified, pending owner review]   # never "accepted"

autonomy:
  mode: autonomous                     # no `continue` between stages; `--staged` is opt-in for owner debugging
  decide_and_log: Docs/V57/DECISIONS.md   # D-### entries instead of questions
  stop_only_on:
    - blocking_intake                  # intake exit code 2
    - irreversible_or_destructive_action   # deleting provider files, force-push, history rewrite
    - owner_stop_token                 # .v57/ALLOW_STOP present at a check point
  hard_stop_actions:
    - edit_tdd                         # Docs/Design/** is never edited to pass a gate
    - edit_provider_art_to_pass_gate   # includes rename/move/delete of provider files; V57 never writes to Source/
  timeboxes:
    stuck_minutes: 45                  # then fallback / cut + D-### (never a placeholder asset; gaps go to Docs/V57/MISSING_ASSETS.md)
    tool_failure_retries: 2            # then alternate route
    max_attempts_per_asset_per_stage: 3
    red_after_green_minutes: 20        # then revert rule (stash + restore last green commit)
  resume_reads: [Docs/V57/STATUS.json, Docs/V57/PLAN.md, Docs/V57/TODO.md, Docs/V57/DEVLOG.md]
  never_prompt_for:
    - yes_before_writing_specs_or_context
    - continue_between_stages
    - variable_confirmation            # resolved from Docs/Generated/json/package.json
    - auto_open_stage_reports

gates:
  A0: { stage: I0, check: "intake exit code == 0 + Docs/V57/MISSING_ASSETS.md written" }
  I1: { stage: I1, check: "baseline eval all true + 0 console errors" }
  I2: { stage: I2, check: "assembly-report.json 0 missing refs, 0 errors" }
  M1: { stage: M1, check: "goldpath checks.json all pass, 0 errors" }
  F:  { stage: F,  check: "per spec EditMode+PlayMode green via unity test AND goldpath green" }
  M2:
    stage: M2
    checks: [runtime_lint_exit_0, hierarchy_diff_clean, colliders_with_mesh, goldpath_green]   # no player build unless the owner asks
    evidence:
      - Docs/V57/evidence/M2/<UTC>/lint.json          # runtime-lint over Assets/_Game/Scripts + Assets/_Game/Tests, exit 0
      - Docs/V57/reports/hierarchy-diff.json          # must contain pass: true
  M3:
    stage: M3
    check: "independent review every scored area >= min_score"
  M4:
    stage: M4
    check: "playability-cert + qa from evidence; status words only"
  independent_review:
    skill: V57/agents/skills/commands/review/unity-independent-review-skill.md
    min_score: 7
    max_rounds: 3
    reviewer: fresh_context          # new subagent / provider session each round; implementer never writes the verdict
  self_grading_allowed: false

review_standards:
  read_in_order:
    - V57/docs/standards/STANDARDS_CANONICAL.md
    - V57/agents/skills/shared/checks/unity-validation-skill.md
    - V57/agents/skills/shared/references/unity-naming-skill.md
    - V57/docs/standards/CODING_STANDARDS.md

rules:
  # Primary Editor drive: Unity CLI + com.unity.pipeline (`unity command` / `eval` / `test`).
  # `unity mcp` is an optional Cursor stdio binding to the same Pipeline — not a separate write stack.
  # Legacy com.unity.ai.assistant relay is fallback only (end 2026).
  unity_cli:
    read_from: V57/docs/mcp/UNITY_CLI_INTEGRATIONS.md
    playbook: V57/agents/skills/shared/helpers/unity-cli-ops-skill.md
    invocation: /unity-cli
    enforcement: strict
    required_when_assets_folder_exists: true
    mandatory_for:
      - editor_preflight
      - scene_asset_writes
      - ovr_readback
      - compile_poll
      - save_before_play
      - scene_hierarchy_verify
      - test_runner_execution
      - play_smoke
      - viewport_screenshot
    never_use_mcp_for_when_cli_available:
      - unity_test_runner
      - test_runner_api_via_runcommand
    on_unavailable: stop_do_not_ask_human_manual_editor
    note: >-
      Drive the live Editor with `unity command` / `eval` (and optional `unity mcp` tools over Pipeline).
      STOP if Pipeline/CLI unreachable — do not ask the human to click Hierarchy, and do not blind-edit .unity YAML.
      Do not ship product Scripts/Editor/*Authoring MenuItem utilities; mount scenes via CLI/Pipeline or com.v57.assembly (AssemblyRunner).

  unity_mcp:
    read_from: V57/docs/mcp/UNITY_MCP_REQUIREMENT.md
    enforcement: optional_stdio_binding
    server_id: unity-mcp
    primary_tool: Pipeline via unity mcp stdio
    required_when_assets_folder_exists: false
    on_unavailable: use_unity_cli_directly
    note: >-
      Optional IDE tool surface for the same Pipeline. Prefer `unity command` when the agent shell can run CLI.
      Legacy assistant relay only when GAMEFORGE_UNITY_MCP_MODE=legacy.

  scene_authoring:
    enforcement: strict
    principle: "The saved scene is the game (Edit Mode == Play Mode, except prefab spawns under declared spawn roots)."
    prefer:
      - v57_assembly_runner      # com.v57.assembly: import rules, materials, skybox, atlases, animators, visual prefabs, level scenes (blockout or LevelMaps layout)
      - unity_command_pipeline   # open_scene, create_gameobject, batch, eval, set_serialized_field, …
    layout: Assets/_Game         # single layout; see shared/references/unity-import-skill.md
    prefab_rule: "Gameplay prefab PRF_<Asset> = prefab variant of Visual prefab PRF_<Asset>_Visual"
    runtime_bootstrap: "may only bind [SerializeField] references and call Init in a fixed order"
    forbid:
      - runtime_scene_building             # creating/finding/reparenting/patching scene objects on Awake/Start/Play
      - product_editor_menuitem_authoring  # Assets/**/Scripts/Editor/*Authoring.cs + MenuItem as scene builder
      - human_manual_hierarchy_checklist_as_primary_path
      - blind_unity_yaml_edits_while_editor_reachable
      - patching_assets_via_gameplay_code  # hiding provider renderers, runtime rescale/rotate, runtime material swaps
    banned_runtime_apis:                   # enforced by V57/tools/lint/runtime-lint.js at M2
      - "GameObject.Find*"
      - "Object.FindObjectOfType / FindObjectsOfType / FindObjectsByType / FindFirstObjectByType / FindAnyObjectByType"
      - "reflection SetValue (FieldInfo/PropertyInfo.SetValue, BindingFlags.NonPublic)"
      - "ScriptableObject.CreateInstance as config fallback"
      - "AssetDatabase in runtime code (including #if UNITY_EDITOR blocks)"
      - "Resources.Load for config fallback"
      - "new GameObject / AddComponent / GameObject.CreatePrimitive to build level structure"
      - "hardcoded world coordinates for layout"
      - "Camera.main"
    banned_in_playmode_acceptance_tests:   # Assets/_Game/Tests/PlayMode/Acceptance* and gold path
      - "Physics.Simulate / Physics2D.Simulate"
      - "detectCollisions = false / disabling colliders"
      - "manual position/velocity clamps or teleports"
      - "calling gameplay methods instead of Input System actions"
    max_lines_per_file: 200

  packages:
    read_from: V57/agents/skills/shared/helpers/unity-package-management-skill.md
    invocation: /packages
    enforcement: strict
    description: "UPM add/ensure via PackageManager Client — before nav/l10n/urp crafts"

  canonical_standards:
    read_from: V57/docs/standards/STANDARDS_CANONICAL.md
    enforcement: strict
    note: "Single source of truth for production C#; skills and derived docs must not contradict"

  naming:
