prohibited:
  - pattern: "\\bm_\\w+"
    reason: "Use _camelCase for private fields"
  - pattern: "interface\\s+(?!I[A-Z])[A-Za-z]\\w*"
    reason: "Interfaces must use I prefix"
  - pattern: "public\\s+(?!const\\b|static\\s+readonly\\b|event\\b)\\w+(<.*>)?\\s+\\w+\\s*(=|;)"
    reason: "Use properties or [SerializeField] private instead of public mutable fields"
  - pattern: "GameObject\\.Find\\("
    reason: "Resolve references in Awake/inspector wiring, never search at runtime"
  - pattern: "Camera\\.main"
    reason: "Cache the camera; Camera.main is an anti-pattern in hot paths"
  - pattern: "FindObjects?(OfType|ByType)|FindFirstObjectByType|FindAnyObjectByType"
    reason: "Serialized references only; no runtime scene lookups"
  - pattern: "\\.SetValue\\("
    reason: "No reflection writes in runtime code"
  - pattern: "AssetDatabase\\."
    reason: "No AssetDatabase in runtime assemblies (Editor asmdefs only)"
  - pattern: "Physics2?D?\\.Simulate\\("
    reason: "No faked physics steps in PlayMode acceptance tests or gold path"

documentation:
  class_header: |
    /// <summary>
    /// Description of the class purpose
    /// </summary>
  method_doc: required
  public_api_doc: required

limits:
  max_lines_per_file: 200
  max_classes_per_file: 1
  require_single_responsibility: true

implementation_done_gates:
  read_from: V57/agents/skills/commands/spec/unity-spec-skill.md
  require_acceptance_criteria_in_spec: true
  forge_mode_tests:
    Prototype: false
    VerticalSlice: true
    Production: true
  note: "Prototype (/prototype, /prototype-full, Workbench Prototype Build) never generates or runs tests — always pass --no-tests. Vertical Slice and Production use the gates below unless --no-tests."
  on_spec_implement:
    ensure_test_scaffold_before_tests: true
    test_scaffold_doc: V57/docs/standards/UNITY_TEST_SCAFFOLD.md
    generate_editmode_tests: true
    generate_playmode_tests_when_runtime: true
    run_standards_validation: true
    run_code_reviewer: true
    run_unity_test_runner_via_cli: true
    run_unity_test_runner_via_mcp: false
    block_when_unity_mcp_unavailable: false   # MCP is optional; CLI is primary
    block_when_unity_cli_unavailable_for_tests: true
    note: "Test execution uses unity test / POST /api/unity-cli/test only. Scene/asset writes prefer com.v57.assembly or unity command / Pipeline (optional unity mcp stdio); no product *Authoring MenuItem scripts; no runtime scene builders."
    require_real_input_playmode_tests: true
    require_goldpath_green_after_spec: true
    verify_all_acceptance_criteria: true
    verify_editor_assets_via_readback: true
    run_perf_static_scan: true
    perf_static_scan_skill: V57/agents/skills/commands/perf/unity-performance-audit-skill.md
    editor_ovr_skill: V57/agents/skills/shared/helpers/unity-editor-verification-skill.md
  opt_out_flag: --no-tests
